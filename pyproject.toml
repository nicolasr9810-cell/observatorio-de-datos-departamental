[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observatorio"
version = "2.0.0"
description = "Observatorio socioeconómico de Colombia con énfasis en Nariño"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["observatorio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
